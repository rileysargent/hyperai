<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyperAI</title>
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet"
  />
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Auth Buttons -->
  <div id="authContainer">
    <button onclick="signInWithGoogle()">Sign in with Google</button>
    <button onclick="promptEmailPassword()">Sign in with Email</button>
    <button id="signOutBtn" style="display:none;" onclick="signOut()">Sign Out</button>
  </div>

  <!-- Sidebar (hidden initially) -->
  <div id="sidebar">
    <div id="logo">
      <h1>HyperAI</h1>
      <p>Your AI platform</p>
    </div>
    <!-- Username display -->
    <div id="userDisplay" style="padding:10px; color:#fff;">Not signed in</div>
    <div id="nav">
      <button class="nav-btn active" id="nav-discover" onclick="showPanel('discover')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
        </svg> Discover
      </button>
      <button class="nav-btn" id="nav-chat" onclick="showPanel('chat')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg> Chats
      </button>
    </div>
    <!-- Create bot button -->
    <div style="padding:10px;">
      <button onclick="openBotModal()">Create a Bot</button>
    </div>
    <div id="bot-list">
      <div id="bot-list-empty">No bots yet.<br>Create one!</div>
    </div>
  </div>

  <!-- Main Content -->
  <div id="content">
    <!-- Topbar -->
    <div id="topbar">
      <div id="tb-left">
        <h2 id="tb-title">Discover</h2>
        <p id="tb-sub">Find your AI bots</p>
      </div>
    </div>

    <!-- Discover Panel -->
    <div class="panel show" id="panel-discover">
      <div id="discover-content">
        <!-- Discover content will be populated here -->
      </div>
    </div>

    <!-- Chat Panel -->
    <div class="panel" id="panel-chat">
      <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-area">
          <input 
            type="text" 
            id="chat-input" 
            placeholder="Type your message..." 
            onkeypress="handleChatKeypress(event)"
          />
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <!-- Create Bot Modal -->
    <div id="botModal" style="display:none;">
      <div id="botModalContent">
        <h3>Create a Bot</h3>
        <label>Name (unique):</label>
        <input type="text" id="botNameInput" />
        <label>System Prompt:</label>
        <textarea id="botSysInput"></textarea>
        <label>Starting Message:</label>
        <textarea 
          id="botStartInput" 
          placeholder="Initial message when chat starts"
        ></textarea>
        <div id="botModalActions">
          <button onclick="closeBotModal()">Cancel</button>
          <button onclick="createBot()">Create</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
